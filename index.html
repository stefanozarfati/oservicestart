<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OServiceStart" />
  <meta name="application-name" content="OServiceStart" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>OServiceStart</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
  <link rel="apple-touch-startup-image" href="icon-512.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap');

    :root {
      --orange:      #f07000;
      --orange-light:#ff8c1a;
      --orange-glow: rgba(240,112,0,0.4);
      --green:       #00e676;
      --green-glow:  rgba(0,230,118,0.4);
      --yellow:      #ffcc00;
      --red:         #ff3d3d;
      --dark:        #0a0a0a;
      --dark3:       #1a1a1a;
      --dark4:       #222222;
      --gray:        #888;
      --white:       #f0f0f0;
    }
    /* ── LIGHT MODE overrides ── */
    body.light-mode {
      --dark:        #f0f0f0;
      --dark3:       #e0e0e0;
      --dark4:       #d0d0d0;
      --gray:        #555;
      --white:       #111;
      --orange:      #d06000;
      --orange-light:#c05500;
      --orange-glow: rgba(192,85,0,0.3);
    }
    body.light-mode .ring-bg     { stroke:#ccc; }
    body.light-mode .ring-svg    { filter:drop-shadow(0 0 6px rgba(192,85,0,.2)); }
    body.light-mode .header      { border-bottom-color:#ccc; }
    body.light-mode .device-bar  { background:#e8e8e8; border-bottom-color:#ccc; }
    body.light-mode .big-clock-realtime { color:#888; }
    body.light-mode .settings-toggle,
    body.light-mode .settings-sheet,
    body.light-mode .zero-time-picker,
    body.light-mode .series-info  { border-color:#ccc; background:var(--dark3); }
    body.light-mode .settings-modal { background:rgba(0,0,0,.35); }
    body.light-mode .settings-sheet-header { border-bottom-color:#ccc; }
    body.light-mode .settings-close { background:#ddd; border-color:#bbb; color:#111; }
    body.light-mode .settings-handle { background:#bbb; }
    body.light-mode .time-btn     { border-color:#bbb; background:var(--dark4); }
    body.light-mode .label-input  { background:var(--dark4); border-color:#bbb; color:#111; }
    body.light-mode .tap-hint     { background:rgba(0,0,0,.07); border-color:rgba(0,0,0,.12); color:rgba(0,0,0,.35); }
    body.light-mode .go-flash     { background:rgba(0,180,80,.15); }

    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html,body {
      height:100%; background:var(--dark); color:var(--white);
      font-family:'Rajdhani',sans-serif; overflow:hidden; user-select:none;
    }

    /* ═══════════════ PORTRAIT ═══════════════ */
    body.portrait {
      display:flex; flex-direction:column; align-items:center;
      height:100dvh;
      padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0)
              env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
    }
    body.portrait .clock-col { display:contents; }
    body.portrait .clock-wrap { position:relative; }
    body.portrait .right-col { display:contents; }

    /* ═══════════════ LANDSCAPE ═══════════════ */
    body.landscape {
      display:grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto auto 1fr;
      height:100dvh;
      padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0)
              env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
    }
    body.landscape .header     { padding:5px 16px; }
    body.landscape .device-bar { padding:4px 16px; }
    /* main: clock fills left ~70%, controls strip on right ~30% */
    body.landscape .main {
      display:grid;
      grid-template-columns: 1fr 220px;
      align-items:stretch; padding:0; gap:0; width:100%; overflow:hidden;
    }
    body.landscape .clock-col {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      height:100%; padding:6px 8px;
      border-right:1px solid #1e1e1e;
      position:relative;
    }
    body.landscape.controls-hidden .clock-col { border-right:none; }
    body.landscape .right-col {
      display:flex; flex-direction:column; justify-content:space-between;
      height:100%; padding:8px 10px; gap:5px; overflow-y:auto; overflow-x:hidden;
    }
    /* series in landscape: horizontal compact row */
    body.landscape .series-info  { flex-direction:row; gap:10px; justify-content:space-around; }
    body.landscape .series-divider { width:1px; height:28px; }
    body.landscape .btn-start    { max-width:9999px; padding:10px; font-size:0.8rem; }
    body.landscape .settings-wrap { max-width:9999px; }

    /* ═══════════════ HEADER ═══════════════ */
    .header {
      width:100%; display:flex; align-items:center; justify-content:center;
      gap:10px; padding:10px 18px 7px; border-bottom:1px solid #1e1e1e; flex-shrink:0;
      /* stay above bigClockWrap (z-index:10) */
      position:relative; z-index:15;
    }
    .logo { width:32px; height:32px; object-fit:contain; filter:drop-shadow(0 0 6px var(--orange-glow)); }
    .app-title {
      font-family:'Orbitron',monospace; font-size:0.9rem; font-weight:700;
      letter-spacing:0.12em; color:var(--orange-light); text-shadow:0 0 12px var(--orange-glow);
    }
    .mode-badge {
      margin-left:auto; padding:3px 9px; border:1px solid #333; border-radius:20px;
      font-size:0.6rem; font-weight:700; letter-spacing:0.1em;
      color:var(--gray); text-transform:uppercase; transition:all .3s; white-space:nowrap;
    }
    .mode-badge.clock { color:var(--orange-light); border-color:var(--orange); }

    /* ── Device label bar (between header and main) ── */
    .device-bar {
      width:100%; display:none; align-items:center; justify-content:center;
      padding:8px 16px 7px;
      background:linear-gradient(180deg, #131313 0%, #0a0a0a 100%);
      border-bottom:1px solid #1e1e1e;
      flex-shrink:0;
      /* stay above bigClockWrap (z-index:10) */
      position:relative; z-index:15;
    }
    .device-bar.visible { display:flex; }
    .device-label {
      font-family:'Rajdhani',sans-serif; font-weight:700;
      /* base ~4.35rem ≈ ×3 of old 1.45rem */
      font-size:clamp(2rem, 8vw, 5rem);
      letter-spacing:0.08em; text-transform:uppercase;
      color:var(--white); text-shadow:0 0 20px rgba(255,255,255,.2);
      text-align:center; line-height:1.1;
      max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    /* Device label input in settings */
    .label-input {
      flex:1; background:var(--dark4); border:1px solid #333; border-radius:8px;
      padding:8px 12px; color:var(--white); font-family:'Rajdhani',sans-serif;
      font-size:1.17rem; font-weight:600; outline:none; min-width:0;
      transition:border-color .2s;
    }
    .label-input:focus { border-color:var(--orange); }
    .label-input::placeholder { color:#555; }

    /* ═══════════════ MAIN ═══════════════ */
    .main {
      flex:1; width:100%; display:flex; flex-direction:column;
      align-items:center; justify-content:space-around;
      padding:6px 16px; gap:4px; overflow:hidden;
    }

    /* ═══════════════ REAL CLOCK — BIG MODE ═══════════════ */
    .big-clock-wrap {
      display:none; flex-direction:column; align-items:center; justify-content:center;
      position:fixed; left:0; right:0; bottom:0;
      top:0; /* JS will set the real top after measuring header height */
      z-index:10; background:var(--dark);
      overflow:hidden;
      /* Slight upward bias when no label: content looks better in the upper third */
      padding-bottom:5%;
    }
    /* With label visible: device-bar already shifts the center — no extra bias needed */
    body:has(.device-bar.visible) .big-clock-wrap {
      padding-bottom:0;
    }
    .big-clock-wrap.active { display:flex; }

    .big-clock-time {
      font-family:'Orbitron',monospace; font-weight:900; line-height:1;
      letter-spacing:0; text-align:center;
      transition:color .4s, text-shadow .4s;
      white-space:nowrap;
      display:block; text-align:center; white-space:nowrap;
      /* 8 chars "00:00:00": 15.8vw fits with margin */
      font-size: min(15.8vw, 40vh);
    }
    /* Negative zero-mode: "-HH:MM:SS" = 9 chars, scale to 12vw for safe margin */
    .big-clock-time.negative {
      font-size: min(14.0vw, 36vh) !important;
    }
    body.landscape .big-clock-time {
      font-size: min(calc((100vw - 220px) * 0.158), 40vh);
    }
    body.landscape.controls-hidden .big-clock-time {
      font-size: min(15.8vw, 40vh);
    }
    /* Single digit: 1ch = exact width of "0" in Orbitron — perfectly stable */
    .big-clock-time .cd {
      display:inline-block;
      width:1ch; text-align:center;
      overflow:visible; /* glyph can bleed, but the box never shifts */
    }
    /* Colon: slightly narrower than a digit, equal margin both sides */
    .big-clock-time .cs {
      display:inline-block;
      width:0.7ch; text-align:center;
      overflow:visible;
    }
    /* Sign for negative zero-mode */
    .big-clock-time .sg {
      display:inline-block;
      width:1ch; text-align:center;
      overflow:visible;
    }
    /* default: positive / normal */
    .big-clock-time.normal  { color:var(--orange-light); text-shadow:0 0 24px var(--orange-glow); }
    /* counting down to zero → negative time → red */
    .big-clock-time.negative { color:var(--red);  text-shadow:0 0 24px rgba(255,61,61,.5); }
    /* at / past zero → green */
    .big-clock-time.positive-zero { color:var(--orange-light); text-shadow:0 0 24px var(--orange-glow); }

    .big-clock-sub {
      font-family:'Rajdhani',sans-serif; font-weight:600;
      letter-spacing:0.18em; text-transform:uppercase;
      color:var(--gray); margin-top:6px; text-align:center;
    }
    /* small real-time label below zero display */
    .big-clock-realtime {
      font-family:'Rajdhani',sans-serif; font-weight:500; font-size:0.8rem;
      letter-spacing:0.12em; color:#555; margin-top:4px; text-align:center;
    }

    /* ═══════════════ RING (conto alla rovescia) ═══════════════ */
    .clock-col { }
    .clock-wrap {
      position:relative; display:flex; align-items:center; justify-content:center;
    }
    .ring-svg { transform:rotate(-90deg); filter:drop-shadow(0 0 8px var(--orange-glow)); }
    .ring-bg { fill:none; stroke:#1e1e1e; }
    .ring-progress {
      fill:none; stroke:var(--orange); stroke-linecap:round;
      transition:stroke-dashoffset 0.15s linear, stroke .3s;
    }
    .ring-progress.warning { stroke:var(--yellow); }
    .ring-progress.go      { stroke:var(--green); }
    .clock-center {
      position:absolute; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
    }
    .countdown {
      font-family:'Orbitron',monospace; font-weight:900; line-height:1;
      color:var(--white); text-shadow:0 0 20px rgba(255,255,255,.3); transition:color .3s;
    }
    .countdown.warning { color:var(--yellow); text-shadow:0 0 20px rgba(255,204,0,.5); }
    .countdown.go      { color:var(--green);  text-shadow:0 0 20px rgba(0,230,118,.5); }
    .status-label {
      font-weight:600; letter-spacing:0.2em; text-transform:uppercase;
      color:var(--gray); margin-top:4px;
    }

    /* ═══════════════ SERIES INFO ═══════════════ */
    .series-info { display:flex; gap:18px; align-items:center; flex-shrink:0; }
    .series-block { display:flex; flex-direction:column; align-items:center; gap:2px; }
    .series-num { font-family:'Orbitron',monospace; font-weight:700; color:var(--orange-light); }
    .series-lbl { font-size:0.62rem; font-weight:600; letter-spacing:.15em; color:var(--gray); text-transform:uppercase; }
    .series-divider { width:1px; height:28px; background:#2a2a2a; }

    /* ═══════════════ START BUTTON ═══════════════ */
    .btn-start {
      width:100%; max-width:340px; padding:14px; border:none; border-radius:12px;
      background:linear-gradient(135deg,var(--orange),#c05500);
      color:#fff; font-family:'Orbitron',monospace; font-size:0.9rem;
      font-weight:700; letter-spacing:0.15em; cursor:pointer;
      box-shadow:0 4px 20px rgba(240,112,0,.4);
      transition:transform .1s, box-shadow .1s, background .3s; flex-shrink:0;
    }
    .btn-start:active { transform:scale(.97); }
    .btn-start.running { background:linear-gradient(135deg,#444,#222); box-shadow:none; }

    /* ═══════════════ SETTINGS ═══════════════ */
    /* ═══ SETTINGS BUTTON (always visible in controls panel) ═══ */
    .settings-wrap { width:100%; max-width:480px; flex-shrink:0; }
    .settings-toggle {
      width:100%; display:flex; align-items:center; justify-content:space-between;
      background:var(--dark3); border:1px solid #2a2a2a; border-radius:12px;
      padding:12px 18px; cursor:pointer; transition:background .2s;
    }
    .settings-toggle:active { background:var(--dark4); }
    .settings-toggle > span { font-weight:600; font-size:1.17rem; letter-spacing:.08em; color:var(--gray); text-transform:uppercase; }
    .chevron { font-size:1.1rem; color:var(--orange); transition:transform .3s; }

    /* ═══ SETTINGS MODAL OVERLAY ═══ */
    /* Full-screen layer — sits above everything, independent scroll */
    .settings-modal {
      position:fixed; inset:0; z-index:200;
      background:rgba(0,0,0,.55);
      display:none; align-items:flex-end; justify-content:center;
      /* backdrop tap closes modal */
    }
    .settings-modal.open { display:flex; }

    .settings-sheet {
      width:100%; max-width:600px;
      max-height:88dvh;           /* never taller than 88% of screen */
      background:var(--dark2, #111);
      border-radius:20px 20px 0 0;
      border:1px solid #2a2a2a; border-bottom:none;
      display:flex; flex-direction:column;
      overflow:hidden;            /* clip corners */
      animation:slideUp .28s ease;
    }
    @keyframes slideUp {
      from { transform:translateY(100%); }
      to   { transform:translateY(0); }
    }

    /* Drag handle + header row */
    .settings-sheet-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 20px 10px; flex-shrink:0;
      border-bottom:1px solid #222;
    }
    .settings-handle {
      position:absolute; left:50%; top:10px; transform:translateX(-50%);
      width:40px; height:4px; background:#444; border-radius:4px;
    }
    .settings-sheet-title {
      font-weight:700; font-size:1.17rem; letter-spacing:.08em;
      color:var(--gray); text-transform:uppercase;
    }
    .settings-close {
      width:34px; height:34px; border-radius:50%;
      background:#222; border:1px solid #333;
      color:var(--white); font-size:1.2rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0;
    }
    .settings-close:active { background:#333; }

    /* The scrollable body — THIS is the only scrollable element */
    .settings-body {
      flex:1;
      overflow-y:auto;
      overflow-x:hidden;
      -webkit-overflow-scrolling:touch;
      overscroll-behavior:contain;
      touch-action:pan-y;
    }
    .settings-inner { padding:16px 20px 32px; display:flex; flex-direction:column; gap:16px; }

    .sect-label {
      font-size:0.93rem; font-weight:700; letter-spacing:.18em;
      color:var(--orange); text-transform:uppercase;
      border-top:1px solid #2e2e2e; padding-top:10px; margin-top:2px;
    }
    .sect-label:first-child { border-top:none; padding-top:0; margin-top:0; }

    .setting-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .setting-row label { font-weight:600; font-size:1.17rem; color:var(--white); flex:1; min-width:0; }
    .setting-row label small { display:block; font-size:0.95rem; color:var(--gray); font-weight:400; }

    .time-picker { display:flex; align-items:center; gap:6px; }
    .time-btn {
      width:38px; height:38px; border:1px solid #333; border-radius:8px;
      background:var(--dark4); color:var(--orange-light); font-size:1.4rem;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:background .15s; flex-shrink:0;
    }
    .time-btn:active { background:#2e2e2e; }
    .time-val {
      font-family:'Orbitron',monospace; font-weight:700; font-size:1.28rem;
      color:var(--orange-light); min-width:36px; text-align:center;
    }
    .time-val.wide { min-width:54px; }

    /* Toggle switch */
    .toggle-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .toggle-row > label:first-child { font-weight:600; font-size:1.17rem; color:var(--white); flex:1; }
    .toggle-row > label:first-child small { display:block; font-size:0.95rem; color:var(--gray); font-weight:400; }
    .sw { position:relative; width:56px; height:30px; flex-shrink:0; }
    .sw input { opacity:0; width:0; height:0; position:absolute; }
    .sw-track {
      position:absolute; inset:0; background:#333; border-radius:30px;
      cursor:pointer; transition:background .3s;
    }
    .sw-track::after {
      content:''; position:absolute; width:22px; height:22px;
      left:4px; top:4px; background:#fff; border-radius:50%; transition:transform .3s;
    }
    .sw input:checked + .sw-track { background:var(--orange); }
    .sw input:checked + .sw-track::after { transform:translateX(26px); }

    /* Zero time inline picker */
    .zero-time-picker {
      display:none; align-items:center; justify-content:center; gap:10px;
      background:#111; border:1px solid #2a2a2a; border-radius:8px;
      padding:10px 14px; flex-wrap:wrap;
    }
    .zero-time-picker.visible { display:flex; }
    .zero-time-label {
      width:100%; text-align:center;
      font-size:.63rem; color:var(--gray); font-weight:600;
      letter-spacing:.1em; text-transform:uppercase; margin-bottom:2px;
    }
    /* Each digit field: + / value / − stacked */
    .ztp-field {
      display:flex; flex-direction:column; align-items:center; gap:4px;
    }
    .ztp-val {
      font-family:'Orbitron',monospace; font-weight:700; font-size:1.5rem;
      color:var(--orange-light); line-height:1; min-width:2ch; text-align:center;
    }
    .ztp-sep {
      font-family:'Orbitron',monospace; font-weight:900; font-size:1.5rem;
      color:var(--gray); align-self:center; padding:0 2px;
      /* sit level with the digit, skip the top button row (26px btn + 4px gap) */
      margin-top:30px;
    }
    .zero-time-status { font-size:.7rem; color:var(--gray); font-weight:600; padding:2px 8px; background:#1e1e1e; border-radius:6px; text-align:center; }

    /* ═══════════════ GO FLASH ═══════════════ */
    .go-flash {
      position:fixed; inset:0; background:rgba(0,230,118,.15);
      opacity:0; pointer-events:none; transition:opacity .05s; z-index:100;
    }
    .go-flash.on { opacity:1; }

    /* ═══════════════ TAP HINT ═══════════════ */
    /* small pill shown when controls are hidden */
    .tap-hint {
      position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
      background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12);
      border-radius:20px; padding:4px 14px;
      font-size:0.6rem; letter-spacing:0.18em; color:rgba(255,255,255,.35);
      text-transform:uppercase; pointer-events:none;
      opacity:0; transition:opacity .4s;
    }
    body.controls-hidden .tap-hint { opacity:1; }

    /* ═══════════════ PORTRAIT hide controls ═══════════════ */
    /* slide the right-col (which is display:contents in portrait)
       children out of view — we wrap them in a collapsible div */
    .controls-panel {
      display:contents; /* portrait default: transparent wrapper */
    }
    body.portrait .controls-panel {
      display:flex; flex-direction:column; align-items:center;
      width:100%; gap:6px; padding:0 16px 6px;
      transition:opacity .35s, transform .35s;
      flex-shrink:0;
      overflow:visible;
    }
    body.portrait.controls-hidden .controls-panel {
      opacity:0; pointer-events:none;
      transform:translateY(20px);
      max-height:0; overflow:hidden; padding:0; gap:0;
    }
    /* In clock mode: controls float fixed above the clock overlay */
    body.clock-active .controls-panel {
      position:fixed; bottom:0; left:0; right:0;
      z-index:20; background:var(--dark);
      padding:10px 16px 20px;
      border-top:1px solid #222;
      max-height:none;
    }
    body.clock-active.controls-hidden .controls-panel {
      opacity:0; pointer-events:none;
      transform:translateY(30px);
      max-height:0; overflow:hidden; padding:0;
    }

    /* ═══════════════ LANDSCAPE hide controls ═══════════════ */
    body.landscape .main {
      transition:grid-template-columns .35s ease;
    }
    body.landscape.controls-hidden .main {
      grid-template-columns: 1fr 0px !important;
    }
    body.landscape .right-col {
      transition:opacity .3s, padding .35s;
      overflow:visible;
    }
    body.landscape.controls-hidden .right-col {
      opacity:0; pointer-events:none; padding:0;
    }
    /* In clock mode landscape: right-col floats fixed on the right, above the clock */
    body.landscape.clock-active .right-col {
      position:fixed; top:0; right:0; bottom:0;
      width:230px; z-index:20;
      background:var(--dark);
      border-left:1px solid #222;
      padding:8px 10px;
      display:flex; flex-direction:column; justify-content:space-between;
      overflow-y:auto;
    }
    body.landscape.clock-active.controls-hidden .right-col {
      opacity:0; pointer-events:none;
    }
  </style>

    <div style="position:relative;height:0;">
      <div class="settings-handle"></div>
    </div>
    <div class="settings-sheet-header">
      <span class="settings-sheet-title">&#9881; Impostazioni</span>
      <button class="settings-close" onclick="toggleSettings()">&#x2715;</button>
    </div>
    <div class="settings-body" id="settingsBody">
      <div class="settings-inner">

        <!-- ── DISPOSITIVO ── -->
        <div class="sect-label" style="border-top:none;padding-top:0;margin-top:0;">Dispositivo</div>
        <div class="setting-row">
          <label>Etichetta dispositivo<small>appare in testata — visibile agli atleti</small></label>
        </div>
        <div class="setting-row">
          <input class="label-input" id="deviceLabelInput" type="text"
            maxlength="24" placeholder="es. -3' / -2' / Start..."
            oninput="onDeviceLabel(this.value)" />
        </div>

        <!-- ── SCHERMO ── -->
        <div class="sect-label">Schermo</div>

        <div class="toggle-row">
          <label>Tema chiaro<small>utile con molta luce solare</small></label>
          <label class="sw">
            <input type="checkbox" id="swTheme" onchange="onThemeToggle()" />
            <span class="sw-track"></span>
          </label>
        </div>

        <!-- ── TIMER ── -->
        <div class="sect-label">Timer</div>

        <div class="setting-row">
          <label>Intervallo partenze<small>min : sec</small></label>
          <div class="time-picker">
            <button class="time-btn" onclick="adjustTime('m',-1)">&#8722;</button>
            <span class="time-val" id="valMin">1</span>
            <button class="time-btn" onclick="adjustTime('m',+1)">+</button>
            <span style="color:var(--gray);font-weight:700;padding:0 4px;">:</span>
            <button class="time-btn" onclick="adjustTime('s',-5)">&#8722;</button>
            <span class="time-val" id="valSec">00</span>
            <button class="time-btn" onclick="adjustTime('s',+5)">+</button>
          </div>
        </div>


        <div class="toggle-row">
          <label>Suoni<small>disattiva tutti i beep</small></label>
          <label class="sw">
            <input type="checkbox" id="swMute" onchange="onMuteToggle()" />
            <span class="sw-track"></span>
          </label>
        </div>

        <div class="setting-row" id="volRow">
          <label>Volume beep</label>
          <div class="time-picker">
            <button class="time-btn" onclick="adjustVol(-10)">&#8722;</button>
            <span class="time-val" id="valVol">80</span>
            <button class="time-btn" onclick="adjustVol(+10)">+</button>
          </div>
        </div>

        <!-- ── OROLOGIO REALE ── -->
        <div class="sect-label">Orologio</div>

        <div class="toggle-row">
          <label>Attiva modalità orologio<small>mostra hh:mm:ss in primo piano</small></label>
          <label class="sw">
            <input type="checkbox" id="swClock" onchange="onClockToggle()" />
            <span class="sw-track"></span>
          </label>
        </div>

        <div id="clockOptions" style="display:none;flex-direction:column;gap:14px;">

          <div class="setting-row">
            <label>Sfasamento min<small>minuti ±</small></label>
            <div class="time-picker">
              <button class="time-btn" onclick="adjustOffset(-1)">&#8722;</button>
              <span class="time-val" id="valOffset" style="min-width:36px;">+0</span>
              <button class="time-btn" onclick="adjustOffset(+1)">+</button>
            </div>
          </div>
          <div class="setting-row">
            <label>Sfasamento sec<small>secondi ±</small></label>
            <div class="time-picker">
              <button class="time-btn" onclick="adjustOffsetSec(-1)">&#8722;</button>
              <span class="time-val" id="valOffsetSec" style="min-width:36px;">+0</span>
              <button class="time-btn" onclick="adjustOffsetSec(+1)">+</button>
            </div>
          </div>
          <div class="setting-row">
            <label>Sfasamento /10<small>decimi di secondo ±</small></label>
            <div class="time-picker">
              <button class="time-btn" onclick="adjustOffsetTenths(-1)">&#8722;</button>
              <span class="time-val" id="valOffsetTenths" style="min-width:36px;">+0</span>
              <button class="time-btn" onclick="adjustOffsetTenths(+1)">+</button>
            </div>
          </div>

          <div class="toggle-row">
            <label>Abilita ora zero<small>il display mostra 00:00:00 all'ora impostata</small></label>
            <label class="sw">
              <input type="checkbox" id="swZero" onchange="onZeroToggle()" />
              <span class="sw-track"></span>
            </label>
          </div>

          <div class="zero-time-picker" id="zeroTimePicker">
            <span class="zero-time-label">Ora zero</span>
            <div class="ztp-field">
              <button class="time-btn" onclick="adjZeroH(+1)">+</button>
              <span class="ztp-val" id="zeroH">18</span>
              <button class="time-btn" onclick="adjZeroH(-1)">&#8722;</button>
            </div>
            <span class="ztp-sep">:</span>
            <div class="ztp-field">
              <button class="time-btn" onclick="adjZeroM(+1)">+</button>
              <span class="ztp-val" id="zeroM">30</span>
              <button class="time-btn" onclick="adjZeroM(-1)">&#8722;</button>
            </div>
          </div>
          <div class="zero-time-status" id="zeroTimeStatus" style="display:none;"></div>

        </div><!-- /clockOptions -->

      </div><!-- /settings-inner -->
    </div><!-- /settings-body (scrollable) -->
  </div><!-- /settings-sheet -->
</div><!-- /settings-modal -->

<script>
// ════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════
let intervalMin = 1, intervalSec = 0;
let maxSeries   = 0;
let volume      = 0.8;
let soundEnabled = true;

// Clock mode
let clockMode   = false;
let clockOffset = 0;          // minutes offset for displayed time
let clockOffsetSec = 0;        // seconds offset
let clockOffsetTenths = 0;     // tenths of second offset
let zeroMode    = false;
let zeroHour    = 18;
let zeroMinute  = 30;

// Timer state
let running    = false;
let rafId      = null;
let remaining  = 0;
let totalSecs  = 0;
let seriesCount= 0;
let startEpoch = 0;

// Clock tick RAF
let clockRafId = null;

const CIRC = 2 * Math.PI * 145; // ≈ 911

// ════════════════════════════════════════════════════════
//  AUDIO
// ════════════════════════════════════════════════════════
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
/**
 * playBeep — crisp, defined tone using layered oscillators.
 * type: 'square' for sharp attack, blended with sine for warmth.
 * attack: fast ramp-up for definition; decay: smooth tail.
 */
function playBeep(freq, dur, gainVal, fadeStart) {
  if (!soundEnabled) return;
  ensureAudio();
  const now  = audioCtx.currentTime;
  const fade = fadeStart !== undefined ? fadeStart : dur * 0.72;

  // Triangle wave: warm and round, zero metallic harshness
  const osc = audioCtx.createOscillator();
  const g   = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  osc.connect(g);
  g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(volume * gainVal, now + 0.006);
  g.gain.setTargetAtTime(0, now + fade, 0.07);
  osc.start(now);
  osc.stop(now + dur);
}

function beepWarning()   { playBeep(370,  0.55, 0.85); }        // F#4 — caldo
function beepCountdown() { playBeep(523,  0.45, 0.80); }        // C5 — chiaro
function beepGo()        { playBeep(659,  4.73, 1.00, 0.65); }  // E5 — VIA!

// ════════════════════════════════════════════════════════
//  SETTINGS – TIMER
// ════════════════════════════════════════════════════════
function toggleSettings() {
  const modal = document.getElementById('settingsModal');
  const isOpen = modal.classList.toggle('open');
  // Prevent body scroll while modal is open
  document.getElementById('appBody').style.overflow = isOpen ? 'hidden' : '';
  // Scroll sheet back to top each time it opens
  if (isOpen) document.getElementById('settingsBody').scrollTop = 0;
}
function onModalBackdrop(e) {
  // Close when tapping the dark backdrop (not the sheet itself)
  if (e.target === document.getElementById('settingsModal')) toggleSettings();
}

let repTm = null, repIv = null;
function startRep(fn, delta) {
  stopRep();
  window[fn](delta);
  repTm = setTimeout(() => { repIv = setInterval(() => window[fn](delta), 220); }, 600);
}
function stopRep() { clearTimeout(repTm); clearInterval(repIv); repTm=null; repIv=null; }
function adjM(d) { adjustTime('m',d); }
function adjS(d) { adjustTime('s',d); }

function adjustTime(unit, delta) {
  if (running) return;
  if (unit === 'm') {
    intervalMin = Math.max(0, Math.min(99, intervalMin + delta));
    if (intervalMin === 0 && intervalSec < 10) intervalSec = 10;
    document.getElementById('valMin').textContent = intervalMin;
  } else {
    intervalSec = Math.max(0, Math.min(55, intervalSec + delta));
    if (intervalMin === 0 && intervalSec < 10) intervalSec = 10;
    document.getElementById('valSec').textContent = String(intervalSec).padStart(2,'0');
  }
  document.getElementById('intervalDisplay').textContent = fmtMs(intervalMin*60+intervalSec);
document.getElementById('swMute').checked = false; // sounds ON by default

// Settings scroll is now handled by full-screen modal overlay
}
function adjustMax(d) {
  if (running) return;
  maxSeries = Math.max(0, Math.min(99, maxSeries + d));
  document.getElementById('valMax').textContent = maxSeries;
}
function adjustVol(d) {
  const pct = Math.max(10, Math.min(100, Math.round(volume*100)+d));
  volume = pct/100;
  document.getElementById('valVol').textContent = pct;
}
function onDeviceLabel(val) {
  const trimmed = val.trim();
  document.getElementById('deviceLabel').textContent = trimmed;
  document.getElementById('deviceBar').classList.toggle('visible', trimmed.length > 0);
  // Shrink font dynamically if text is long
  // font-size is handled by CSS clamp() — no manual calc needed
}

function onThemeToggle() {
  const light = document.getElementById('swTheme').checked;
  document.getElementById('appBody').classList.toggle('light-mode', light);
  document.querySelector('meta[name="theme-color"]').content = light ? '#f0f0f0' : '#0a0a0a';
}

function onMuteToggle() {
  soundEnabled = !document.getElementById('swMute').checked;
  // Dim the volume row when muted
  document.getElementById('volRow').style.opacity = soundEnabled ? '1' : '0.35';
  document.getElementById('volRow').style.pointerEvents = soundEnabled ? '' : 'none';
}

// ════════════════════════════════════════════════════════
//  SETTINGS – CLOCK MODE
// ════════════════════════════════════════════════════════
function onClockToggle() {
  clockMode = document.getElementById('swClock').checked;
  document.getElementById('clockOptions').style.display = clockMode ? 'flex' : 'none';
  document.getElementById('modeBadge').textContent  = clockMode ? 'OROLOGIO' : 'CONTO';
  document.getElementById('modeBadge').classList.toggle('clock', clockMode);

  // Show/hide the big clock vs ring
  const wrap = document.getElementById('bigClockWrap');
  wrap.classList.toggle('active', clockMode);
  document.getElementById('clockWrap').style.display = clockMode ? 'none' : '';
  if (clockMode) {
    // Position the fixed overlay just below the visible header bars
    const hdr = document.getElementById('appBody').querySelector('.header');
    const dev = document.getElementById('deviceBar');
    const topPx = (hdr ? hdr.offsetTop + hdr.offsetHeight : 0) +
                  (dev && dev.classList.contains('visible') ? dev.offsetHeight : 0);
    wrap.style.top = topPx + 'px';
  }

  document.getElementById('appBody').classList.toggle('clock-active', clockMode);
  if (clockMode) { startClockTick(); setTimeout(fitBigClock, 60); }
  else stopClockTick();
  applyLayout();
}

function adjustOffset(d) {
  clockOffset = Math.max(-59, Math.min(59, clockOffset + d));
  const sign = clockOffset >= 0 ? '+' : '';
  document.getElementById('valOffset').textContent = sign + clockOffset;
}
function adjustOffsetSec(d) {
  clockOffsetSec = Math.max(-59, Math.min(59, clockOffsetSec + d));
  const sign = clockOffsetSec >= 0 ? '+' : '';
  document.getElementById('valOffsetSec').textContent = sign + clockOffsetSec;
}
function adjustOffsetTenths(d) {
  clockOffsetTenths = Math.max(-9, Math.min(9, clockOffsetTenths + d));
  const sign = clockOffsetTenths >= 0 ? '+' : '';
  document.getElementById('valOffsetTenths').textContent = sign + clockOffsetTenths;
}

function onZeroToggle() {
  zeroMode = document.getElementById('swZero').checked;
  document.getElementById('zeroTimePicker').classList.toggle('visible', zeroMode);
  document.getElementById('zeroTimeStatus').style.display = zeroMode ? 'block' : 'none';
  updateZeroStatus();
}

function adjZeroH(d) {
  zeroHour = (zeroHour + d + 24) % 24;
  document.getElementById('zeroH').textContent = String(zeroHour).padStart(2,'0');
  updateZeroStatus();
}
function adjZeroM(d) {
  zeroMinute = (zeroMinute + d + 60) % 60;
  document.getElementById('zeroM').textContent = String(zeroMinute).padStart(2,'0');
  updateZeroStatus();
}

function updateZeroStatus() {
  if (!zeroMode) return;
  const el = document.getElementById('zeroTimeStatus');
  const now = getDisplayTime(); // ms, with offset
  const zeroTs = zeroTimestamp(); // ms of today's zero time
  const diffSec = Math.round((zeroTs - now) / 1000);
  if (diffSec > 0) {
    el.textContent = '⏳ mancano ' + fmtSigned(diffSec) + ' all\'ora zero';
    el.style.color = '#aaa';
  } else if (diffSec === 0) {
    el.textContent = '✅ ora zero ora!';
    el.style.color = 'var(--green)';
  } else {
    el.textContent = 'passate ' + fmtSigned(-diffSec) + ' dall\'ora zero';
    el.style.color = 'var(--orange-light)';
  }
}

// Returns a Date timestamp (ms) for today's zeroHour:zeroMinute:00
function zeroTimestamp() {
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), now.getDate(),
                  zeroHour, zeroMinute, 0, 0).getTime();
}

// Returns current display time in ms (real + offset)
function getDisplayTime() {
  return Date.now() + clockOffset * 60000 + clockOffsetSec * 1000 + clockOffsetTenths * 100;
}

// ════════════════════════════════════════════════════════
//  BIG CLOCK TICK
// ════════════════════════════════════════════════════════
let _fitDone = false;
function startClockTick() {
  stopClockTick();
  _fitDone = false;
  function tick() {
    if (!clockMode) return;

    const nowDisp = getDisplayTime(); // ms with offset
    const zeroTs  = zeroMode ? zeroTimestamp() : null;

    let timeStr, phase, subText, realTimeStr = '';

    if (zeroMode) {
      const diffMs  = nowDisp - zeroTs;       // positive = past zero, negative = before zero
      const diffSec = Math.floor(diffMs / 1000);
      const absSec  = Math.abs(diffSec);
      const hh = Math.floor(absSec / 3600);
      const mm = Math.floor((absSec % 3600) / 60);
      const ss = absSec % 60;
      const sign = diffSec < 0 ? '-' : '';

      timeStr = sign + String(hh).padStart(2,'0') + ':' +
                       String(mm).padStart(2,'0') + ':' +
                       String(ss).padStart(2,'0');

      if (diffSec < 0) {
        phase   = 'negative';
        subText = 'ALL\'ORA ZERO';
      } else if (diffSec === 0) {
        phase   = 'positive-zero';
        subText = '▶ VIA!';
      } else {
        phase   = 'positive-zero';
        subText = 'IN CORSO';
      }

      // Show real clock time as small info below
      const rd = new Date(nowDisp);
      realTimeStr = 'ora reale: ' + String(rd.getHours()).padStart(2,'0') + ':' +
                    String(rd.getMinutes()).padStart(2,'0') + ':' +
                    String(rd.getSeconds()).padStart(2,'0');
      updateZeroStatus();

    } else {
      // Normal real clock
      const d = new Date(nowDisp);
      timeStr = String(d.getHours()).padStart(2,'0')   + ':' +
                String(d.getMinutes()).padStart(2,'0') + ':' +
                String(d.getSeconds()).padStart(2,'0');
      phase   = 'normal';
      subText = running ? 'IN CORSO' : 'IN ATTESA';
      const _totOff = clockOffset*60000 + clockOffsetSec*1000 + clockOffsetTenths*100;
      if (_totOff !== 0) {
        const _sign = _totOff >= 0 ? '+' : '-';
        const _abs = Math.abs(_totOff);
        const _om = Math.floor(_abs/60000);
        const _os = Math.floor((_abs%60000)/1000);
        const _ot = Math.floor((_abs%1000)/100);
        realTimeStr = 'sfas. ' + _sign + _om + 'm ' + _os + 's .' + _ot;
      }
    }

    const bigEl = document.getElementById('bigClockTime');
    bigEl.className = 'big-clock-time ' + phase;
    // Each character in its own 1ch-wide span — perfectly stable layout.
    // 1ch = advance width of "0" in Orbitron, same for every digit.
    (function() {
      let inner = '';
      for (let i = 0; i < timeStr.length; i++) {
        const c = timeStr[i];
        if (c === ':')      inner += '<span class="cs">:</span>';
        else if (c === '-') inner += '<span class="sg">-</span>';
        else                inner += '<span class="cd">' + c + '</span>';
      }
      bigEl.innerHTML = inner;
    })();
    document.getElementById('bigClockSub').textContent = subText;
    document.getElementById('bigClockRealtime').textContent = realTimeStr;

    if (!_fitDone) {
      const w = document.getElementById('bigClockWrap');
      if (w && w.offsetWidth > 0) { fitBigClock(); _fitDone = true; }
    }
    clockRafId = requestAnimationFrame(tick);
  }
  clockRafId = requestAnimationFrame(tick);
}

function stopClockTick() {
  if (clockRafId) { cancelAnimationFrame(clockRafId); clockRafId = null; }
}

// ════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════
function fmtMs(s) { return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function fmtClock(d) { return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtSigned(sec) {
  const h = Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  if (h>0) return h+'h '+String(m).padStart(2,'0')+'m';
  if (m>0) return m+'m '+String(s).padStart(2,'0')+'s';
  return s+'s';
}

function updateRing(val, total) {
  const ratio = total>0 ? val/total : 0;
  document.getElementById('ringProg').style.strokeDashoffset = CIRC*(1-ratio);
}

function setPhase(phase) {
  const cd  = document.getElementById('countdown');
  const lbl = document.getElementById('statusLabel');
  const p   = document.getElementById('ringProg');
  cd.className = 'countdown ' + phase;
  p.className  = 'ring-progress ' + phase;
  lbl.textContent = phase==='warning' ? 'PREPARARSI'
                  : phase==='go'      ? '▶ VIA!'
                  : 'IN PARTENZA';
}

// ════════════════════════════════════════════════════════
//  CLOCK-GRID SYNC
//  Every "VIA" fires at a Unix timestamp that is an exact
//  multiple of totalSecs (counted from midnight UTC+0,
//  which is equivalent to any fixed epoch — all devices
//  share the same grid as long as their clocks are in sync).
// ════════════════════════════════════════════════════════

/**
 * Returns the Unix timestamp (ms) of the NEXT grid point
 * that is at least `minAheadMs` milliseconds in the future.
 * Grid = multiples of totalSecs since Unix epoch (ms).
 */
function nextGridMs(nowMs, periodSec, minAheadMs) {
  const periodMs = periodSec * 1000;
  // How many full periods fit up to now+minAhead?
  const horizon  = nowMs + minAheadMs;
  const count    = Math.floor(horizon / periodMs);
  // Next grid point after the horizon
  return (count + 1) * periodMs;
}

/** Format ms timestamp as hh:mm:ss */
function fmtTs(ms) {
  const d = new Date(ms);
  return String(d.getHours()).padStart(2,'0')   + ':' +
         String(d.getMinutes()).padStart(2,'0') + ':' +
         String(d.getSeconds()).padStart(2,'0');
}

// ════════════════════════════════════════════════════════
//  MAIN LOGIC
// ════════════════════════════════════════════════════════
function handleStart() {
  ensureAudio();
  running ? stopSession() : startSession();
}

function startSession() {
  running     = true;
  seriesCount = 0;
  totalSecs   = intervalMin*60 + intervalSec;
  if (totalSecs < 10) totalSecs = 10;
  document.getElementById('seriesCount').textContent = '0';
  document.getElementById('btnStart').innerHTML = '&#9632;&nbsp; FERMA';
  document.getElementById('btnStart').classList.add('running');
  launchCycle();
}

function launchCycle() {
  if (!running) return;
  if (maxSeries>0 && seriesCount>=maxSeries) { stopSession(); return; }

  // ── Align to clock grid ──────────────────────────────
  // Require at least 1.2 s ahead so there's always time to
  // show the countdown (avoids an instant GO on slow taps).
  const nowMs   = Date.now();
  const fireMs  = nextGridMs(nowMs, totalSecs, 1200);
  startEpoch    = fireMs - totalSecs * 1000;  // "virtual start" of this period
  remaining     = (fireMs - nowMs) / 1000;    // seconds until GO

  // Show next-start time as hh:mm:ss
  document.getElementById('nextStart').textContent = fmtTs(fireMs);

  if (!clockMode) {
    setPhase('');
    updateRing(remaining, totalSecs);
    document.getElementById('countdown').textContent = fmtMs(Math.ceil(remaining));
  }

  let warned=false, b3=false, b2=false, b1=false;

  function tick() {
    if (!running) return;
    remaining = Math.max(0, (fireMs - Date.now()) / 1000);

    if (remaining < 0.04) {
      remaining = 0; seriesCount++;
      document.getElementById('seriesCount').textContent = seriesCount;

      if (!clockMode) {
        setPhase('go');
        document.getElementById('countdown').textContent = 'VIA!';
        updateRing(0, totalSecs);
      }

      beepGo(); flashGo();

      if (maxSeries>0 && seriesCount>=maxSeries) {
        setTimeout(()=>stopSession(), 2000);
      } else {
        // 1 second of VIA! then align to next grid point
        setTimeout(()=>launchCycle(), 1000);
      }
      return;
    }

    // Beeps
    if (!warned && remaining<=10.05 && totalSecs>12) { warned=true; setPhase('warning'); beepWarning(); }
    if (!b3 && remaining<=3.05 && remaining>2.9)  { b3=true; beepCountdown(); }
    if (!b2 && remaining<=2.05 && remaining>1.9)  { b2=true; beepCountdown(); }
    if (!b1 && remaining<=1.05 && remaining>0.9)  { b1=true; beepCountdown(); }

    if (!clockMode) {
      document.getElementById('countdown').textContent = fmtMs(Math.ceil(remaining));
      updateRing(remaining, totalSecs);
      if (remaining>10 && totalSecs>12) setPhase('');
    }

    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

function stopSession() {
  running = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId=null; }
  document.getElementById('btnStart').innerHTML = '&#9654;&nbsp; AVVIA';
  document.getElementById('btnStart').classList.remove('running');
  if (!clockMode) {
    document.getElementById('countdown').textContent  = '--:--';
    document.getElementById('statusLabel').textContent= 'IN ATTESA';
    setPhase(''); updateRing(0,1);
  }
  document.getElementById('nextStart').textContent = '--:--';
}

function flashGo() {
  const el = document.getElementById('goFlash');
  el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'), 1000);
}

// ════════════════════════════════════════════════════════
//  LAYOUT / RESIZE
// ════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════
//  CONTROLS VISIBILITY TOGGLE
// ════════════════════════════════════════════════════════
let controlsVisible = true;
let hideTimer = null;

function toggleControls(e) {
  // Don't toggle when tapping interactive settings elements
  if (e && e.target.closest('#controlsPanel')) return;
  controlsVisible = !controlsVisible;
  document.getElementById('appBody').classList.toggle('controls-hidden', !controlsVisible);
  // In landscape, recalculate ring size after transition
  if (window.innerWidth > window.innerHeight) {
    setTimeout(() => { resizeElements(); fitBigClock(); }, 370);
  } else {
    fitBigClock();
  }
}

// Tap anywhere outside controls toggles visibility
document.addEventListener('click', function(e) {
  const panel = document.getElementById('controlsPanel');
  if (panel && panel.contains(e.target)) return;
  if (e.target.closest('.header') || e.target.closest('.device-bar')) return;
  // In clock mode, bigClockWrap is fixed on top — its clicks reach here too
  if (e.target.closest('#settingsModal')) return;
  toggleControls(e);
});

function fitBigClock() {
  // CSS min(17vw, 40vh) handles sizing immediately.
  // This function refines with exact probe measurement once Orbitron is loaded.
  requestAnimationFrame(() => {
    const bkFace = document.getElementById('bigClockTime');
    const bcWrap = document.getElementById('bigClockWrap');
    if (!bcWrap || !bkFace) return;
    // bigClockWrap is flex:1 in .main — offsetWidth/Height are now correct
    const cW = bcWrap.offsetWidth  || window.innerWidth;
    const cH = bcWrap.offsetHeight || (window.innerHeight - 110);
    if (cW <= 20 || cH <= 20) return;

    // Probe: measure real Orbitron text width detached from layout
    const probe = document.createElement('span');
    probe.style.cssText = [
      'position:fixed','visibility:hidden','pointer-events:none',
      'white-space:nowrap','font-family:Orbitron,monospace',
      'font-weight:900','font-size:100px','letter-spacing:0.04em',
      'font-variant-numeric:tabular-nums','font-feature-settings:"tnum"',
      'left:-9999px','top:-9999px'
    ].join(';');
    probe.textContent = '00:00:00';
    document.body.appendChild(probe);
    const refW = probe.offsetWidth;
    document.body.removeChild(probe);

    // If probe returns 0 or fallback font size, skip — CSS value is fine
    if (refW < 80) return;  // Orbitron at 100px should be >500px; fallback fonts ~600px

    const scale = Math.min((cW * 0.96) / refW, (cH * 0.43) / 100);
    const fsBig = Math.max(12, Math.floor(100 * scale));
    bkFace.style.fontSize = fsBig + 'px';

    const subFs = Math.max(12, fsBig * 0.16);
    document.getElementById('bigClockSub').style.fontSize      = subFs + 'px';
    document.getElementById('bigClockRealtime').style.fontSize = Math.max(10, subFs * 0.82) + 'px';
  });
}

function applyLayout() {
  const isLS = window.innerWidth > window.innerHeight;
  const body = document.getElementById('appBody');
  body.classList.toggle('landscape', isLS);
  body.classList.toggle('portrait', !isLS);
  resizeElements();
}

function resizeElements() {
  const isLS = window.innerWidth > window.innerHeight;
  const W = window.innerWidth, H = window.innerHeight;

  // ── RING ──
  // landscape: clock-col is ~(W-220)px wide, height = H minus header+devbar (~55px)
  // portrait:  standard sizing
  const svg  = document.getElementById('ringSvg');
  const wrap = document.getElementById('clockWrap');
  let avail;
  if (isLS) {
    const hidden = !controlsVisible;
    const colW = hidden ? W : W - 220;
    // Use getBoundingClientRect for accurate header + device-bar height
    const hdr = document.querySelector('.header');
    const dev = document.getElementById('deviceBar');
    const hdrH = hdr ? hdr.getBoundingClientRect().height : 55;
    const devH = (dev && dev.classList.contains('visible')) ? dev.getBoundingClientRect().height : 0;
    const colH = H - hdrH - devH - 16; // 16px bottom breathing room
    avail = Math.min(colW * 0.82, colH * 0.92);
  } else {
    avail = Math.min(W * 0.70, H * 0.34, 320);
  }
  svg.style.width = svg.style.height = avail+'px';
  wrap.style.width= wrap.style.height= avail+'px';
  document.getElementById('countdown').style.fontSize    = (avail*0.22)+'px';
  document.querySelector('.status-label').style.fontSize = (avail*0.07)+'px';

  // ── BIG CLOCK ──
  // Defer to next paint so the DOM reflects the actual visible layout
  // (device-bar visible/hidden, controls visible/hidden, etc.)
  fitBigClock();

  // ── RIGHT-COL series numbers: scale down in landscape ──
  document.querySelectorAll('.series-num').forEach(el => {
    el.style.fontSize = isLS ? '0.85rem' : '';
  });
  document.querySelectorAll('.series-lbl').forEach(el => {
    el.style.fontSize = isLS ? '0.55rem' : '';
  });
}

window.addEventListener('resize', applyLayout);
window.addEventListener('orientationchange', ()=>setTimeout(applyLayout,120));
applyLayout();

// Init
document.getElementById('intervalDisplay').textContent = fmtMs(intervalMin*60+intervalSec);
document.getElementById('zeroH').textContent = String(zeroHour).padStart(2,'0');
document.getElementById('zeroM').textContent = String(zeroMinute).padStart(2,'0');

// Re-fit clock once fonts are ready
document.fonts.ready.then(() => { if (clockMode) fitBigClock(); });
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
</script>
